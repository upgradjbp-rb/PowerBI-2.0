<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>upgrad X | Guided Power BI Project: Finance Analysis Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              red: '#E94256',
              redDark: '#C82D40',
              blue: '#2563EB',
              emerald: '#10B981',
              gold: '#F59E0B',
              navy: '#091E53',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #E94256;
    }

    /* Dark Slate Glassmorphism */
    .glass-panel {
      background: rgba(30, 41, 59, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .glass-header {
      background: rgba(11, 17, 32, 0.90);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    /* Power BI UI Pill Badges */
    .pbi-table {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(37, 99, 235, 0.22);
      border: 1px solid rgba(96, 165, 250, 0.5);
      color: #93C5FD;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.12rem 0.55rem;
      border-radius: 0.45rem;
      white-space: nowrap;
    }

    .pbi-measure {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(16, 185, 129, 0.20);
      border: 1px solid rgba(52, 211, 153, 0.5);
      color: #6EE7B7;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.12rem 0.55rem;
      border-radius: 0.45rem;
      white-space: nowrap;
    }

    .pbi-param {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(245, 158, 11, 0.20);
      border: 1px solid rgba(251, 191, 36, 0.5);
      color: #FCD34D;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.12rem 0.55rem;
      border-radius: 0.45rem;
      white-space: nowrap;
    }

    /* Slide Fade Animation */
    @keyframes slideFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide-animate {
      animation: slideFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom Checkbox */
    .step-checkbox:checked + .step-label {
      text-decoration: line-through;
      color: #64748B;
    }

    /* Subtle Radial Grid Background */
    .bg-grid-pattern {
      background-color: #0B1120;
      background-image:
        radial-gradient(at 88% 10%, rgba(233, 66, 86, 0.13) 0px, transparent 50%),
        radial-gradient(at 12% 88%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
        linear-gradient(rgba(148, 163, 184, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
    }

    /* Fullscreen / Presentation Mode */
    body.presentation-mode #sidebar {
      display: none !important;
    }
  </style>
</head>
<body class="bg-grid-pattern text-slate-100 font-sans antialiased selection:bg-brand-red selection:text-white overflow-hidden h-screen flex flex-col">

  <!-- FIXED TOP HEADER BAR -->
  <header class="glass-header h-16 px-4 lg:px-6 flex items-center justify-between z-30 shrink-0">
    <!-- Left: Slide Index Toggle + upGrad X Branding + Project Title -->
    <div class="flex items-center gap-3 sm:gap-4">
      <button id="toggleSidebarBtn" onclick="toggleSidebar()" title="Toggle Slide Index Sidebar"
        class="inline-flex items-center gap-2 px-2.5 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white bg-slate-900/90 border border-slate-800 hover:border-slate-700 transition focus:outline-none">
        <i class="fa-solid fa-bars-staggered text-sm text-brand-red"></i>
        <span class="hidden sm:inline">Slide Index</span>
      </button>

      <!-- upGrad X Logo -->
      <div class="flex items-center gap-2.5 select-none">
        <div class="flex items-center bg-slate-900 border border-slate-700/80 px-3 py-1.5 rounded-xl shadow-md">
          <span class="font-extrabold tracking-tight text-white text-base sm:text-lg leading-none">upgrad</span>
          <span class="ml-1.5 inline-flex items-center justify-center w-6 h-6 rounded-md bg-brand-red text-white font-black text-sm shadow-sm shadow-brand-red/40">X</span>
        </div>
        <div class="hidden md:block h-6 w-px bg-slate-800"></div>
        <div class="hidden md:flex flex-col">
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold text-white leading-tight">Finance Analysis Dashboard</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider bg-amber-500/15 text-amber-300 border border-amber-500/30">
              Power BI Edition (upgrad X Guided Project)
            </span>
          </div>
          <span class="text-[11px] text-slate-400 font-mono">PowerBI_Finance_Analysis.pbix • 1800 × 950 px</span>
        </div>
      </div>
    </div>

    <!-- Center: Overall Completion Progress Counter -->
    <div class="hidden xl:flex items-center gap-3 bg-slate-900/90 border border-slate-800 px-4 py-1.5 rounded-full">
      <i class="fa-solid fa-list-check text-emerald-400 text-xs"></i>
      <span class="text-xs font-medium text-slate-300">Build Checklist:</span>
      <div class="w-28 h-2 bg-slate-800 rounded-full overflow-hidden">
        <div id="checklistProgressBar" class="h-full bg-gradient-to-r from-brand-red via-amber-400 to-emerald-400 transition-all duration-300" style="width: 0%"></div>
      </div>
      <span id="checklistProgressText" class="text-xs font-mono font-bold text-white">0/38 (0%)</span>
    </div>

    <!-- Right: Interactive Canvas Preview Jump, Presentation Mode, Slide Counter -->
    <div class="flex items-center gap-2 sm:gap-2.5">
      <!-- Jump to Interactive Canvas Preview (Slide 10) -->
      <button onclick="goToSlide(9)" title="Jump to Live Interactive Dashboard Preview"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600/20 text-blue-300 border border-blue-500/40 hover:bg-blue-600/30 hover:text-white transition">
        <i class="fa-solid fa-wand-magic-sparkles text-blue-400"></i>
        <span class="hidden sm:inline">Interactive Canvas Preview</span>
      </button>

      <!-- Fullscreen / Presentation Mode Toggle -->
      <button id="presentationBtn" onclick="togglePresentationMode()" title="Toggle Fullscreen / Presentation Mode"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800/90 text-slate-200 border border-slate-700 hover:border-brand-red/60 hover:text-white transition">
        <i class="fa-solid fa-expand"></i>
        <span class="hidden md:inline">Present</span>
      </button>

      <!-- Slide Counter -->
      <div class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 font-mono text-xs font-semibold text-slate-300">
        <span id="currentSlideNum" class="text-brand-red font-bold">01</span> / <span id="totalSlidesNum">10</span>
      </div>
    </div>
  </header>

  <!-- TOP SLIDE PROGRESS BAR -->
  <div class="w-full h-1 bg-slate-900 shrink-0">
    <div id="slideProgressBar" class="h-full bg-gradient-to-r from-brand-red via-blue-500 to-emerald-400 transition-all duration-300" style="width: 10%"></div>
  </div>

  <!-- MAIN WORKSPACE -->
  <div class="flex flex-1 overflow-hidden relative">

    <!-- COLLAPSIBLE SLIDE INDEX SIDEBAR -->
    <aside id="sidebar" class="w-72 lg:w-80 bg-slate-950/95 border-r border-slate-800/90 flex flex-col justify-between shrink-0 transition-all duration-300 z-20 overflow-y-auto">
      <div class="p-4">
        <div class="flex items-center justify-between mb-3 px-2">
          <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">10-Slide Curriculum Index</span>
          <button onclick="resetChecklist()" class="text-[11px] text-slate-500 hover:text-brand-red transition" title="Reset all progress checkboxes">
            <i class="fa-solid fa-rotate-left mr-1"></i>Reset
          </button>
        </div>

        <nav id="slideNavList" class="space-y-1">
          <!-- Populated dynamically via JS -->
        </nav>
      </div>

      <!-- Bottom Quick Hex Palette & Legend -->
      <div class="p-4 border-t border-slate-800/80 bg-slate-900/50 space-y-3">
        <div>
          <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Quick-Copy Layout Hex Codes</p>
          <div class="grid grid-cols-3 gap-1.5">
            <button onclick="copyText('#091E53', 'Copied Sidebar Navy #091E53!')" class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-lg px-2 py-1 text-[11px] font-mono text-slate-200 transition">
              <span class="w-3 h-3 rounded-sm bg-[#091E53] border border-slate-600 shrink-0"></span>#091E53
            </button>
            <button onclick="copyText('#F5F7FB', 'Copied Canvas Light #F5F7FB!')" class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-lg px-2 py-1 text-[11px] font-mono text-slate-200 transition">
              <span class="w-3 h-3 rounded-sm bg-[#F5F7FB] border border-slate-600 shrink-0"></span>#F5F7FB
            </button>
            <button onclick="copyText('#FFFFFF', 'Copied Card White #FFFFFF!')" class="flex items-center gap-1.5 bg-slate-950 border border-slate-800 hover:border-blue-500 rounded-lg px-2 py-1 text-[11px] font-mono text-slate-200 transition">
              <span class="w-3 h-3 rounded-sm bg-[#FFFFFF] border border-slate-600 shrink-0"></span>#FFFFFF
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-800/70">
          <span class="pbi-table text-[10px]">Table / Col</span>
          <span class="pbi-measure text-[10px]">DAX Measure</span>
          <span class="pbi-param text-[10px]">Parameter</span>
        </div>
      </div>
    </aside>

    <!-- MAIN SLIDE VIEWPORT -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
      <div id="slideViewport" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 flex flex-col items-center">
        <div id="slideContainer" class="w-full max-w-6xl my-auto">
          <!-- Active Slide Rendered Here -->
        </div>
      </div>

      <!-- FIXED BOTTOM NAVIGATION BAR -->
      <footer class="glass-header h-16 px-4 sm:px-8 flex items-center justify-between shrink-0 z-20">
        <button id="prevBtn" onclick="prevSlide()"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold bg-slate-800/90 text-slate-200 border border-slate-700 hover:bg-slate-700 disabled:opacity-40 disabled:pointer-events-none transition">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Previous</span>
        </button>

        <!-- Clickable Dot Indicators + Keyboard Shortcut Hints -->
        <div class="flex flex-col items-center gap-1">
          <div id="slideDots" class="flex items-center gap-1.5">
            <!-- Populated dynamically via JS -->
          </div>
          <span class="hidden sm:inline text-[11px] text-slate-500">
            Navigate with <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">←</kbd> <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">→</kbd> Arrow Keys
          </span>
        </div>

        <button id="nextBtn" onclick="nextSlide()"
          class="inline-flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-semibold bg-brand-red text-white shadow-lg shadow-brand-red/25 hover:bg-brand-redDark transition">
          <span>Next Slide</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </footer>
    </main>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-20 right-6 z-50 transform translate-y-12 opacity-0 pointer-events-none transition-all duration-300">
    <div class="flex items-center gap-2.5 bg-slate-900/95 border border-emerald-500/60 text-emerald-200 px-4 py-3 rounded-xl shadow-2xl">
      <i class="fa-solid fa-circle-check text-emerald-400"></i>
      <span id="toastMessage" class="text-sm font-semibold">Copied to clipboard!</span>
    </div>
  </div>

  <!-- JAVASCRIPT APPLICATION LOGIC -->
  <script>
    // State Variables
    let currentSlideIndex = 0;
    let checkedSteps = JSON.parse(localStorage.getItem('upgradx_pbi_finance_checks') || '{}');
    let slide6SelectedMetric = 0; // 0: Total Amount, 1: Total Fees, 2: Total Tax, 3: Total Transactions
    let simYear = '2025';
    let simMetric = 'amount';
    let simPage = 'overview';

    // Helper: Render Persistent Checkbox Item
    function renderCheckItem(id, htmlText) {
      const isChecked = !!checkedSteps[id];
      return `
        <label class="flex items-start gap-3 p-2.5 rounded-xl bg-slate-950/65 hover:bg-slate-900/95 border border-slate-800/80 cursor-pointer transition select-none">
          <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${id}', this.checked)"
            class="step-checkbox mt-0.5 w-4 h-4 rounded accent-brand-red cursor-pointer shrink-0" />
          <span class="step-label text-xs sm:text-[13px] text-slate-200 leading-relaxed">${htmlText}</span>
        </label>
      `;
    }

    // Helper: Render DAX Code Card with One-Click Copy
    function renderDaxCard(id, title, badgeText, badgeClass, daxCode) {
      const encodedCode = encodeURIComponent(daxCode);
      return `
        <div class="bg-slate-950/90 border border-slate-800 hover:border-slate-700 rounded-xl p-3.5 flex flex-col justify-between transition">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <span class="font-bold text-white text-xs sm:text-sm">${title}</span>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
            <button onclick="copyEncoded('${encodedCode}', 'Copied ${title} DAX!')"
              class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-brand-red text-slate-200 hover:text-white text-[11px] font-semibold transition flex items-center gap-1.5 shrink-0">
              <i class="fa-regular fa-copy"></i> Copy
            </button>
          </div>
          <pre class="font-mono text-xs text-emerald-300 bg-slate-900/90 border border-slate-800/80 rounded-lg p-2.5 overflow-x-auto leading-relaxed">${escapeHtml(daxCode)}</pre>
        </div>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function copyEncoded(encodedStr, msg) {
      copyText(decodeURIComponent(encodedStr), msg);
    }

    // =========================================================================
    // 10 SELF-CONTAINED CURRICULUM SLIDES
    // =========================================================================
    const slides = [
      // SLIDE 01: Project Overview & Architecture Blueprint
      {
        navTitle: '01. Project Overview & Blueprint',
        render: () => `
          <div class="slide-animate space-y-6">
            <!-- Hero Banner -->
            <div class="glass-panel rounded-3xl p-6 sm:p-9 border border-slate-700/70 relative overflow-hidden">
              <div class="absolute -right-20 -top-20 w-72 h-72 bg-brand-red/15 rounded-full blur-3xl pointer-events-none"></div>
              <div class="absolute -left-20 -bottom-20 w-72 h-72 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>

              <div class="flex flex-wrap items-center gap-2.5 mb-4">
                <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/40">
                  <i class="fa-solid fa-bolt mr-1.5"></i>Power BI Edition (upgrad X Guided Project)
                </span>
                <span class="px-3 py-1 rounded-full text-xs font-mono font-semibold bg-slate-900 text-slate-300 border border-slate-700">
                  Deliverable: PowerBI_Finance_Analysis.pbix
                </span>
              </div>

              <h1 class="text-3xl sm:text-4xl lg:text-5xl font-black tracking-tight text-white leading-tight mb-3">
                Finance Analysis Dashboard — <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-red via-amber-400 to-emerald-400">End-to-End Power BI Walkthrough</span>
              </h1>
              <p class="text-slate-300 text-sm sm:text-base max-w-3xl leading-relaxed">
                A complete, step-by-step enterprise BI build taking raw CSV transaction and customer logs through Power Query ETL, 1:Many Star Schema modeling, Time Intelligence YoY DAX, Dynamic Field Parameters, and a multi-page Drill-Through executive report.
              </p>

              <!-- 6 Core Architecture Overview Cards -->
              <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mt-7">
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-3.5">
                  <div class="text-brand-red text-lg mb-1"><i class="fa-solid fa-file-csv"></i></div>
                  <div class="text-xs font-bold text-white">2 CSV Sources</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">finance_transactions &amp; customers</div>
                </div>
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-3.5">
                  <div class="text-blue-400 text-lg mb-1"><i class="fa-solid fa-diagram-project"></i></div>
                  <div class="text-xs font-bold text-white">1:* Star Schema</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">Customers + DAX Calendar</div>
                </div>
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-3.5">
                  <div class="text-emerald-400 text-lg mb-1"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                  <div class="text-xs font-bold text-white">INR (₹) &amp; YoY DAX</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">SAMEPERIODLASTYEAR</div>
                </div>
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-3.5">
                  <div class="text-amber-400 text-lg mb-1"><i class="fa-solid fa-sliders"></i></div>
                  <div class="text-xs font-bold text-white">Field Parameter</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">4-Metric Dynamic Switch</div>
                </div>
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-3.5">
                  <div class="text-purple-400 text-lg mb-1"><i class="fa-solid fa-vector-square"></i></div>
                  <div class="text-xs font-bold text-white">1800 × 950 px</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">#091E53 Sidebar + #F5F7FB</div>
                </div>
                <div class="bg-slate-950/85 border border-slate-800 rounded-2xl p-3.5">
                  <div class="text-rose-400 text-lg mb-1"><i class="fa-solid fa-layer-group"></i></div>
                  <div class="text-xs font-bold text-white">2 Drill-Through Pages</div>
                  <div class="text-[11px] text-slate-400 mt-0.5">Overview + Transactions</div>
                </div>
              </div>
            </div>

            <!-- Interactive Phase Roadmap Cards (Click any phase to jump directly to its slide) -->
            <div>
              <div class="flex items-center justify-between mb-3 px-1">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Interactive 8-Phase Roadmap (Click Any Phase to Jump)</h2>
                <span class="text-xs text-slate-500">10 Guided Slides</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                ${[
                  { phase: 'Phase 1', title: 'Data Import & Power Query ETL', slide: 1, icon: 'fa-broom', color: 'text-brand-red', desc: 'Load 2 CSVs, deduplicate, trim, abs(), impute null fee 14.52, merge names.' },
                  { phase: 'Phase 2', title: 'Data Modeling & DAX Calendar', slide: 2, icon: 'fa-calendar-days', color: 'text-blue-400', desc: '1:* relationships, CALENDAR() table, chronological Month sorting.' },
                  { phase: 'Phase 3', title: 'Core & YoY DAX Measures', slide: 3, icon: 'fa-calculator', color: 'text-emerald-400', desc: '22 DAX measures across Amount, Txns, Avg Value, Fees, Tax & INR formatting.' },
                  { phase: 'Phase 4', title: 'Dynamic Metric Parameter', slide: 5, icon: 'fa-sliders', color: 'text-amber-400', desc: 'Modeling Field Parameter + SWITCH() Dynamic Item title column.' },
                  { phase: 'Phase 5', title: '1800×950 Canvas Layout', slide: 6, icon: 'fa-palette', color: 'text-purple-400', desc: 'Navy #091E53 sidebar, #F5F7FB main panel, Card (new) header banner.' },
                  { phase: 'Phase 6', title: 'Top Slicers & 5 YoY KPI Cards', slide: 7, icon: 'fa-gauge-high', color: 'text-sky-400', desc: 'Year (2025), Metric, Occupation & Category slicers + YoY Reference Labels.' },
                  { phase: 'Phase 7', title: '6 Overview Charts & Interactions', slide: 8, icon: 'fa-chart-area', color: 'text-rose-400', desc: 'Smooth Area trend, 2 Donuts, 2 Horizontal Bars, fx Heat-Map Table.' },
                  { phase: 'Phase 8', title: 'Transactions Drill-Through & Sim', slide: 9, icon: 'fa-magnifying-glass-chart', color: 'text-emerald-300', desc: '10-col detail table, Drill-Through, Page Navigator & Live Simulator.' },
                ].map(p => `
                  <button onclick="goToSlide(${p.slide})"
                    class="text-left glass-panel rounded-2xl p-4 border border-slate-800 hover:border-brand-red/60 hover:bg-slate-800/70 transition group">
                    <div class="flex items-center justify-between mb-1.5">
                      <span class="text-[11px] font-mono font-bold uppercase ${p.color}">${p.phase}</span>

                          <div class="text-[8px] text-slate-400 pt-1 border-t border-slate-100 flex justify-between">
                            <span>Right-click any visual on Overview Analysis → Drill-through → Transactions</span>
                            <span class="font-bold text-slate-600">Slicers Synced ✓</span>
                          </div>
                        </div>
                      `}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      }
    ];

    // =========================================================================
    // INTERACTIVITY & NAVIGATION CONTROLLERS
    // =========================================================================
    function toggleCheck(id, checked) {
      checkedSteps[id] = checked;
      localStorage.setItem('upgradx_pbi_finance_checks', JSON.stringify(checkedSteps));
      updateChecklistProgress();
    }

    function resetChecklist() {
      checkedSteps = {};
      localStorage.removeItem('upgradx_pbi_finance_checks');
      renderSlide(currentSlideIndex);
      updateChecklistProgress();
      showToast('All build progress checkboxes reset.');
    }

    function updateChecklistProgress() {
      // Count total unique checkbox IDs across the 10 slides
      const totalItems = 27;
      const completed = Object.values(checkedSteps).filter(Boolean).length;
      const pct = Math.min(100, Math.round((completed / totalItems) * 100));
      const bar = document.getElementById('checklistProgressBar');
      const txt = document.getElementById('checklistProgressText');
      if (bar) bar.style.width = `${pct}%`;
      if (txt) txt.textContent = `${completed}/${totalItems} (${pct}%)`;
    }

    function setSlide6Metric(order) {
      slide6SelectedMetric = order;
      renderSlide(5);
    }

    function setSimYear(val) {
      simYear = val;
      renderSlide(9);
      showToast(`Simulated Year Slicer → ${val}`);
    }

    function setSimMetric(val) {
      simMetric = val;
      renderSlide(9);
      showToast(`Simulated Dynamic Metric → ${val.toUpperCase()}`);
    }

    function setSimPage(page) {
      simPage = page;
      renderSlide(9);
      showToast(`Switched Page Navigator → ${page === 'overview' ? 'Overview Analysis' : 'Transactions'}`);
    }

    function renderNavigation() {
      const navList = document.getElementById('slideNavList');
      const dotsContainer = document.getElementById('slideDots');

      navList.innerHTML = slides.map((s, idx) => {
        const active = idx === currentSlideIndex;
        return `
          <button onclick="goToSlide(${idx})"
            class="w-full text-left px-3 py-2.5 rounded-xl text-xs font-medium flex items-center justify-between transition ${
              active
                ? 'bg-brand-red text-white font-bold shadow-md shadow-brand-red/25'
                : 'text-slate-300 hover:bg-slate-900 hover:text-white'
            }">
            <span class="truncate">${s.navTitle}</span>
            ${active ? '<i class="fa-solid fa-chevron-right text-[10px]"></i>' : ''}
          </button>
        `;
      }).join('');

      dotsContainer.innerHTML = slides.map((_, idx) => {
        const active = idx === currentSlideIndex;
        return `
          <button onclick="goToSlide(${idx})" title="Go to Slide ${idx + 1}"
            class="h-2 rounded-full transition-all ${
              active ? 'w-6 bg-brand-red' : 'w-2 bg-slate-700 hover:bg-slate-500'
            }"></button>
        `;
      }).join('');
    }

    function renderSlide(index) {
      currentSlideIndex = index;
      const slide = slides[index];
      document.getElementById('slideContainer').innerHTML = slide.render();
      document.getElementById('slideViewport').scrollTop = 0;

      // Update Header Counter & Top Progress Bar
      document.getElementById('currentSlideNum').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('totalSlidesNum').textContent = String(slides.length).padStart(2, '0');
      const pct = ((index + 1) / slides.length) * 100;
      document.getElementById('slideProgressBar').style.width = `${pct}%`;

      // Update Footer Prev/Next Buttons
      document.getElementById('prevBtn').disabled = index === 0;
      const nextBtn = document.getElementById('nextBtn');
      if (index === slides.length - 1) {
        nextBtn.innerHTML = '<span>Restart Deck</span> <i class="fa-solid fa-rotate-right"></i>';
      } else {
        nextBtn.innerHTML = '<span>Next Slide</span> <i class="fa-solid fa-arrow-right"></i>';
      }

      renderNavigation();
      updateChecklistProgress();
    }

    function goToSlide(index) {
      if (index >= 0 && index < slides.length) {
        renderSlide(index);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < slides.length - 1) {
        renderSlide(currentSlideIndex + 1);
      } else {
        renderSlide(0);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('hidden');
    }

    function togglePresentationMode() {
      document.body.classList.toggle('presentation-mode');
      const isPresent = document.body.classList.contains('presentation-mode');
      const btn = document.getElementById('presentationBtn');
      if (isPresent) {
        btn.classList.add('border-brand-red', 'text-brand-red');
        if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        showToast('Presentation Mode ON (Press Esc to exit)');
      } else {
        btn.classList.remove('border-brand-red', 'text-brand-red');
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    // Keyboard Arrow Navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'Escape' && document.body.classList.contains('presentation-mode')) {
        togglePresentationMode();
      }
    });

    // iFrame-Safe Clipboard Copy Helper
    function copyText(text, successMsg = 'Copied to clipboard!') {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (err) {
        showToast('Unable to copy text.');
      }
      document.body.removeChild(textarea);
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = msg;
      toast.classList.remove('translate-y-12', 'opacity-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 2500);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
</body>
</html>
